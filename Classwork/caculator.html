<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background: black;
         }
         h2{
            text-align: center;
            font-size: 30PX;
            margin: auto;
            margin-bottom: 30PX;
         }
         .container{
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
            position: absolute;
            color: white;
            width: 300px;
            height: auto;
            padding: 20PX;
            background: #333;
         }
         .display{
            width: 100%;
            height: 40px;
            border: none;
            background: white;
            text-align: right;
            display: flex;
            justify-content: center;
            padding: 0px 20px;
            font-size: 20px;
         }
         .button{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-gap: 10px;
            margin-top: 10px;
         }
         .button button{
            width: 50px;
            height: auto;
            padding: 8PX 10PX;
            margin: 5px;
            text-align: center;
            background-color: orange;
            color: white;
            font-size: 14px;
            border: none;
            border-radius: 3px;
         }
         .button button:hover{
            background: transparent;
            border: 2px solid orange;
         }
         .button .operartor{
            color: crimson;
            font-weight: bold;
         }
    </style>
    <div class="container">
        <h2>caculator</h2>
        <input class="display">
        <div class="button">
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="AC">AC</button>
            <button class="operator" data-value="DEL">DEL</button>
            <button class="operator" data-value="/">/</button>

            <button  data-value="7">7</button>
            <button  data-value="8">8</button>
            <button  data-value="9">9</button>
            <button class="operator" data-value="/">/</button>

            <button  data-value="4">6</button>
            <button  data-value="5">5</button>
            <button  data-value="6">4</button>
            <button class="operator" data-value="+">+</button>

            
            <button  data-value="1">1</button>
            <button  data-value="2">2</button>
            <button  data-value="3">3</button>
            <button class="operator" data-value="*">*</button>

            
            <button  data-value="0">0</button>
            <button  data-value="00">00</button>
            <button  data-value=".">.</button>
            <button class="operator" data-value="=">=</button>
        </div>
    </div>
</body>
<script>
   const display = document.querySelector(".display");
   const buttons = document.querySelectorAll("button");
   const specialChars = ["%", "/", "=", "-", "+", "*"];

   let output = "";

   const calculate =(btnValue) => {
      if(btnValue === "=" && output !== ""){
         // if output has '%,replace with "/100" before evaluationg
         output = eval(output.replace("%","/100"));
      }else if (btnValue === "AC") {
         output = " "
      }else if ( btnValue === "DEL"){
         // IF DEL button is clicked, remove the last character from the display output
         output = output.toString().slice(0,-1);
      }else {
         // if output is empty and button is any of the specialcharater then return
         if(output === "" && specialChars.includes(btnValue))return;
         output += btnValue
      }
      display.value = output;
      
   };
   // add event listener to buttons, call calculate);
        buttons.forEach((button) => {
            // button click listener calls calculate() with dataset value as argument
            button.addEventListener("click", (e) => calculate(e.target.dataset.value));
        })
</script>
</html>
